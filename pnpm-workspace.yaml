packages:
  - apps/*
  - bots/*
  - extensions/*
  - packages/*

allowBuilds:
  '@tailwindcss/oxide': set this to true or false
  '@vercel/speed-insights': set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false

allowUnusedPatches: true

patchedDependencies:
  '@tailwindcss/vite@4.1.11': patches/@tailwindcss__vite@4.1.11.patch
